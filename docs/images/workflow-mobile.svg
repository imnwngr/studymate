<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1270" viewBox="0 0 680 1270" role="img" aria-labelledby="title desc"><title id="title">Scan to verification, mobile layout</title><desc id="desc">Five sequential supported Apply stages, with a separate read-only Inspector observation and JSON export path. Verification is observed UI state, not grading.</desc><rect width="680" height="1270" rx="24" fill="#111223"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="60" fill="#f4f1fc" font-size="34" font-weight="600">From scan to verified state.</text><rect x="100" y="110" width="540" height="112" rx="14" fill="#1b1b31" stroke="#514363"/><text x="124" y="148" fill="#bba8f3" font-size="22">01</text><text x="172" y="149" fill="#f1ecff" font-size="29" font-weight="600">Scan</text><text x="124" y="192" fill="#c1bdd1" font-size="22">Read accessible frames and controls</text><path d="M370 222v24m-6-6 6 6 6-6" fill="none" stroke="#b9a7ef" stroke-width="2"/><rect x="100" y="256" width="540" height="112" rx="14" fill="#1b1b31" stroke="#514363"/><text x="124" y="294" fill="#bba8f3" font-size="22">02</text><text x="172" y="295" fill="#f1ecff" font-size="29" font-weight="600">Detect exercise</text><text x="124" y="338" fill="#c1bdd1" font-size="22">Select a supported interaction adapter</text><path d="M370 368v24m-6-6 6 6 6-6" fill="none" stroke="#b9a7ef" stroke-width="2"/><rect x="100" y="402" width="540" height="112" rx="14" fill="#1b1b31" stroke="#514363"/><text x="124" y="440" fill="#bba8f3" font-size="22">03</text><text x="172" y="441" fill="#f1ecff" font-size="29" font-weight="600">Resolve mapping</text><text x="124" y="484" fill="#c1bdd1" font-size="22">Require an eligible answer / QTI mapping</text><path d="M370 514v24m-6-6 6 6 6-6" fill="none" stroke="#b9a7ef" stroke-width="2"/><rect x="100" y="548" width="540" height="112" rx="14" fill="#1b1b31" stroke="#514363"/><text x="124" y="586" fill="#bba8f3" font-size="22">04</text><text x="172" y="587" fill="#f1ecff" font-size="29" font-weight="600">Apply</text><text x="124" y="630" fill="#c1bdd1" font-size="22">Use the website’s supported controls</text><path d="M370 660v24m-6-6 6 6 6-6" fill="none" stroke="#b9a7ef" stroke-width="2"/><rect x="100" y="694" width="540" height="112" rx="14" fill="#1b1b31" stroke="#514363"/><text x="124" y="732" fill="#bba8f3" font-size="22">05</text><text x="172" y="733" fill="#f1ecff" font-size="29" font-weight="600">Verify</text><text x="124" y="776" fill="#c1bdd1" font-size="22">Inspect observed state and identities</text><path d="M100 166H46v820h54" fill="none" stroke="#67cddc" stroke-width="2" stroke-dasharray="5 7"/><text x="100" y="882" fill="#cfc1e5" font-size="22">Unverified? Stop and review.</text><rect x="100" y="930" width="540" height="205" rx="16" fill="#111d2a" stroke="#3d646f"/><text x="124" y="968" fill="#8bdfeb" font-size="20">SEPARATE READ-ONLY PATH</text><text x="124" y="1014" fill="#edf9fc" font-size="31" font-weight="600">Inspector</text><text x="124" y="1059" fill="#c0d9e1" font-size="22">Observe · Capture / record · Export JSON</text><text x="124" y="1101" fill="#aac6d0" font-size="21">No application. No correctness claim.</text><text x="40" y="1190" fill="#aba4bf" font-size="22">UI verification does not guarantee</text><text x="40" y="1221" fill="#aba4bf" font-size="22">grading or saved scores.</text></g></svg>